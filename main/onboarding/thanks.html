<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All set</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0f14;
    color: #fff;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .card { padding: 32px 28px; max-width: 340px; }
  .dot {
    width: 48px; height: 48px; border-radius: 50%;
    background: #12181f; border: 1px solid #2a333d;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    color: #d4af6a; font-size: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #8a97a6; font-size: 14px; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="dot">&#10003;</div>
  <h1>All set!</h1>
  <p>Check your keychain's screen to say hello.</p>
</div>
</body>
</html>
